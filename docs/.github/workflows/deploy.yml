# Builds the site and deploys it to Cloudflare Pages on every push to main.
# Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5
        with:
          path: wardrik_docs

      # The build writes the SDK reference from ../wardrik_typescript.
      - uses: actions/checkout@v5
        with:
          repository: wardrik-dev/wardrik_typescript
          path: wardrik_typescript

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wardrik_docs/package-lock.json

      - run: npm ci
        working-directory: wardrik_docs

      - run: npm run build
        working-directory: wardrik_docs

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: wardrik_docs
          command: pages deploy dist --project-name=wardrik-docs --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

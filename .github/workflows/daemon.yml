name: Daemon

# A wardrik_daemon-v* tag builds the daemon's release tarball and image on Linux, x86_64 and
# aarch64, each on a runner of its own, boots both, and publishes them: the
# tarballs, their SHA256SUMS and install.sh as a GitHub release, a pre-release
# for a version such as 0.1.0-rc.1, and the image as
# ghcr.io/wardrik-dev/wardrik:<version>, with :latest unless it's a
# pre-release.
#
# The build resolves every dependency mix.exs names from Hex, with WARDRIK_HEX=1,
# so the wardrik_* packages it depends on must be published to Hex at the
# versions it names.

on:
  push:
    tags: ["wardrik_daemon-v*"]

permissions:
  contents: read

jobs:
  build:
    name: build (linux-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - {arch: x86_64, platform: amd64, runner: ubuntu-24.04}
          - {arch: aarch64, platform: arm64, runner: ubuntu-24.04-arm}
    outputs:
      version: ${{ steps.tarball.outputs.version }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wardrik" >> "$GITHUB_OUTPUT"

      # The image first, so its cache holds the build stage the tarball is
      # taken from too.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: packages/wardrik_daemon
          target: image
          load: true
          tags: wardrik:ci
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,scope=release-${{ matrix.arch }},mode=max

      - name: Build the tarball
        uses: docker/build-push-action@v6
        with:
          context: packages/wardrik_daemon
          target: tarball
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=release-${{ matrix.arch }}

      - name: Name the tarball
        id: tarball
        run: |
          version=$(sed -n 's/^ *version: "\(.*\)",$/\1/p' packages/wardrik_daemon/mix.exs)
          if [ "$GITHUB_REF_NAME" != "wardrik_daemon-v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match mix.exs's version $version" >&2
            exit 1
          fi
          name="wardrik-$version-linux-${{ matrix.arch }}.tar.gz"
          mv "dist/wardrikd-$version.tar.gz" "$name"
          {
            echo "version=$version"
            echo "name=$name"
          } >> "$GITHUB_OUTPUT"

      # Installed with install.sh from a directory of its own, the way a
      # release is, into a home with nothing in it, and set up by wardrik init
      # with no terminal: the daemon starts, holds the assistant and its
      # sealed key, and distribution and epmd listen on loopback alone.
      - name: Install and boot it
        env:
          NAME: ${{ steps.tarball.outputs.name }}
          VERSION: ${{ steps.tarball.outputs.version }}
        run: |
          downloads=$(mktemp -d)
          cp "$NAME" "$downloads/"
          (cd "$downloads" && sha256sum "$NAME" > SHA256SUMS)

          HOME=$(mktemp -d)
          export HOME
          # The runner's image points these at its own home.
          unset XDG_CONFIG_HOME XDG_DATA_HOME XDG_STATE_HOME
          WARDRIK_VERSION="$VERSION" WARDRIK_DOWNLOAD_URL="file://$downloads" sh packages/wardrik_daemon/install.sh
          wardrik="$HOME/.local/bin/wardrik"

          trap '"$wardrik" stop || true' EXIT
          CI_KEY=sk-ant-ci "$wardrik" init --org ci --provider anthropic --key-from-env CI_KEY \
            --no-service --no-ask
          "$wardrik" status
          "$wardrik" ls | grep -q "^assistant "
          "$wardrik" vault ls | grep -q ANTHROPIC_API_KEY

          if ss -Hltnp | awk '/beam|epmd/ && $4 !~ /^(127\.0\.0\.1|\[::1\]):/ { print; found = 1 } END { exit !found }'; then
            echo "distribution is listening beyond loopback" >&2
            exit 1
          fi

      # Started on named volumes, as the README runs it: the API answers on the
      # port it is run with, and refuses a request without a token. wardrik
      # init writes the assistant into the config volume and seals its key,
      # with no terminal, and the daemon restarts itself to read config.yaml.
      - name: Boot the image
        run: |
          docker run -d --name wardrik -p 127.0.0.1:4747:4747 \
            -v wardrik-config:/config -v wardrik:/data wardrik:ci
          trap 'docker logs wardrik 2>&1 | tail -n 40' ERR

          code() { curl -s -o /dev/null -w '%{http_code}' "$@" http://127.0.0.1:4747/v1/agents; }
          answering() { for _ in $(seq 60); do [ "$(code)" != 000 ] && break; sleep 1; done; }
          answering
          docker exec wardrik wardrik status
          test "$(code)" = 401

          docker exec -e CI_KEY=sk-ant-ci wardrik wardrik init --provider anthropic \
            --key-from-env CI_KEY --no-service --no-ask
          answering
          defined() { docker exec wardrik wardrik ls | grep -q "^assistant "; }
          for _ in $(seq 60); do defined && break; sleep 1; done
          defined
          docker exec wardrik wardrik vault ls | grep -q ANTHROPIC_API_KEY
          test "$(docker inspect --format '{{.Config.User}}' wardrik)" = wardrik
          docker stop wardrik

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.tarball.outputs.name }}
          path: ${{ steps.tarball.outputs.name }}
          if-no-files-found: error
          retention-days: 7

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker tag wardrik:ci "$IMAGE:sha-$GITHUB_SHA-$PLATFORM"
          docker push "$IMAGE:sha-$GITHUB_SHA-$PLATFORM"

  # The images the build job booted, one for each platform, joined into one
  # and named for the version, with :latest unless it's a pre-release.
  image:
    name: image
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - env:
          IMAGE: ${{ needs.build.outputs.image }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tags=(-t "$IMAGE:$VERSION")
          case "$VERSION" in *-*) ;; *) tags+=(-t "$IMAGE:latest") ;; esac
          docker buildx imagetools create "${tags[@]}" \
            "$IMAGE:sha-$GITHUB_SHA-amd64" "$IMAGE:sha-$GITHUB_SHA-arm64"

  # The tarballs the build job booted, their SHA256SUMS and install.sh, as a
  # release named for the tag: a pre-release for a version such as 0.1.0-rc.1.
  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: packages/wardrik_daemon/install.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v5
        with:
          pattern: wardrik-*-linux-*.tar.gz
          merge-multiple: true

      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          case "$VERSION" in *-*) prerelease=--prerelease ;; *) prerelease= ;; esac
          sha256sum wardrik-*.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" wardrik-*.tar.gz SHA256SUMS packages/wardrik_daemon/install.sh \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes $prerelease

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Compiles deps in two OS processes, matching the 2-vCPU runner a private
  # repo gets.
  MIX_OS_DEPS_COMPILE_PARTITION_COUNT: "2"

jobs:
  # One leg per `mix precommit` group, each with a cache of its own. The
  # groups are listed in mix.exs.
  check:
    name: ${{ matrix.group }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        group: [lint, test, dialyzer]
    steps:
      - uses: actions/checkout@v7

      - id: setup
        uses: ./.github/actions/setup
        with:
          cache-key: ${{ matrix.group }}

      - run: mix precommit --check --only ${{ matrix.group }}

      # Saved from a failed leg too, since the compile it paid for is still
      # good; not from a cancelled one, which may have left _build half-written.
      - if: ${{ !cancelled() && steps.setup.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ steps.setup.outputs.key }}

  # The TypeScript SDK: its types are the ones the protocol's schemas make,
  # its tests pass, and it builds.
  sdk-typescript:
    name: sdk (typescript)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm run build

  release:
    name: release (linux-x86_64)
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: prod
    outputs:
      version: ${{ steps.tarball.outputs.version }}
      name: ${{ steps.tarball.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - id: setup
        uses: ./.github/actions/setup
        with:
          cache-key: release

      - name: Build
        run: mix release --overwrite

      - name: Name the tarball
        id: tarball
        run: |
          version=$(sed -n 's/^ *version: "\(.*\)",$/\1/p' mix.exs)
          name="wardrik-$version-linux-x86_64.tar.gz"
          mv "_build/prod/wardrikd-$version.tar.gz" "$name"
          rm -rf _build/prod/rel
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - if: ${{ !cancelled() && steps.setup.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ steps.setup.outputs.key }}

      # Unpacked somewhere new and started with no keys and no home of its own,
      # the way a first install is: one agent file that reads, one that does
      # not, a data directory someone else made open to everyone, and a first
      # try at distribution on every interface.
      - name: Boot it
        run: |
          root=$(mktemp -d)
          tar -xzf "${{ steps.tarball.outputs.name }}" -C "$root"
          HOME=$(mktemp -d)
          export HOME
          # The runner's image points these at its own home.
          unset XDG_CONFIG_HOME XDG_DATA_HOME XDG_STATE_HOME

          mkdir -p "$HOME/.config/wardrik/agents"
          printf 'You help.\n' > "$HOME/.config/wardrik/agents/good.md"
          printf -- '---\norg: acme/eu\n---\nYou help.\n' > "$HOME/.config/wardrik/agents/bad.md"
          mkdir -p -m 755 "$HOME/.local/share/wardrik"

          # Distribution beyond loopback is refused until someone says so.
          if WARDRIK_DIST_INTERFACE=any "$root/bin/wardrik" start 2> refused.txt; then
            echo "wardrik started with distribution on every interface" >&2
            exit 1
          fi
          grep -q "beyond loopback" refused.txt
          if pgrep -f "$root/erts-[^/]*/bin/beam"; then
            echo "a node was left running after wardrik refused to start" >&2
            exit 1
          fi

          "$root/bin/wardrik" start
          trap '"$root/bin/wardrik" stop || true' EXIT

          "$root/bin/wardrikd" rpc '
            {:ok, _pid} = Wardrik.Fleet.spawn(Wardrik.Fleet.key("smoke"))
            ["_/_/good", "_/_/smoke"] = Enum.sort(Enum.map(Wardrik.Fleet.list(), & &1.key))
          '

          "$root/bin/wardrik" status | tee status.txt
          grep -q "_/_/smoke" status.txt
          grep -q "_/_/good" status.txt
          grep -q "bad.md: a fleet key segment may not contain" status.txt

          for private in "$HOME/.local/share/wardrik" "$HOME/.local/share/wardrik/store" "$HOME/.local/state/wardrik"; do
            test "$(stat -c %a "$private")" = 700 || { echo "$private is not private" >&2; exit 1; }
          done
          test "$(stat -c %a "$HOME/.local/share/wardrik/cookie")" = 600
          test "$(stat -c %a "$HOME/.local/state/wardrik/log/wardrik.log")" = 600

          if ss -Hltnp | awk '/beam|epmd/ && $4 !~ /^(127\.0\.0\.1|\[::1\]):/ { print; found = 1 } END { exit !found }'; then
            echo "distribution is listening beyond loopback" >&2
            exit 1
          fi

          # A stop returns once the node is gone, so a start straight after
          # begins a node of its own.
          "$root/bin/wardrik" stop
          if pgrep -f "$root/erts-[^/]*/bin/beam"; then
            echo "the node was still running after wardrik stop returned" >&2
            exit 1
          fi

          "$root/bin/wardrik" start
          "$root/bin/wardrik" status | tee status.txt
          grep -q "_/_/good" status.txt

      - name: Show the daemon's logs
        if: failure()
        run: |
          for log in /tmp/tmp.*/.local/state/wardrik/log/*.log /tmp/tmp.*/.local/state/wardrik/tmp/log/erlang.log.*; do
            [ -f "$log" ] && { echo "== $log"; tail -n 80 "$log"; }
          done
          true

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.tarball.outputs.name }}
          path: ${{ steps.tarball.outputs.name }}
          if-no-files-found: error

  # A v* tag publishes the tarball the release job booted, once every check
  # has passed.
  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.release.outputs.name }}

      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          TARBALL: ${{ needs.release.outputs.name }}
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match mix.exs version $VERSION" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "$TARBALL" --repo "$GITHUB_REPOSITORY" --generate-notes

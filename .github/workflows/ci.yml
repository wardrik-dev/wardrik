name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Compiles deps in two OS processes, matching the 2-vCPU runner a private
  # repo gets.
  MIX_OS_DEPS_COMPILE_PARTITION_COUNT: "2"

jobs:
  # What to run: on a pull request, the precommit groups of the Mix projects
  # it changes and of those that build against what it changed, and the jobs
  # below whose inputs it changed; on a push, everything. See dev/affected.sh.
  projects:
    name: projects
    runs-on: ubuntu-24.04
    outputs:
      check: ${{ steps.affected.outputs.check }}
      release: ${{ steps.affected.outputs.release }}
      hosts: ${{ steps.affected.outputs.hosts }}
      sdk: ${{ steps.affected.outputs.sdk }}
      docs: ${{ steps.affected.outputs.docs }}
      arches: ${{ steps.arches.outputs.arches }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: affected
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '--all' }}
        run: dev/affected.sh "$BASE" | tee -a "$GITHUB_OUTPUT"

      # A pull request builds the release on x86_64, and on arm64 too only
      # where it changes how the release is built; a push builds it on both,
      # which the image job joins.
      - id: arches
        env:
          EVENT: ${{ github.event_name }}
          ARM: ${{ steps.affected.outputs.arm }}
        run: |
          x86='{"arch":"x86_64","platform":"amd64","runner":"ubuntu-24.04"}'
          arm='{"arch":"aarch64","platform":"arm64","runner":"ubuntu-24.04-arm"}'
          if [ "$EVENT" = pull_request ] && [ "$ARM" != true ]; then arches="[$x86]"; else arches="[$x86,$arm]"; fi
          echo "arches=$arches" >> "$GITHUB_OUTPUT"

  # One leg per Mix project, running the `mix precommit` groups it needs with
  # a cache of its own. See tools/precommit.
  check:
    name: ${{ matrix.project }}
    needs: projects
    if: needs.projects.outputs.check != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.projects.outputs.check) }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    env:
      # The projects whose tests reach Postgres or an S3 service fail rather
      # than skip the tests that need them.
      SERVICES: ${{ contains(matrix.only, 'test') && contains(fromJSON('["packages/wardrik_daemon", "packages/wardrik"]'), matrix.project) }}
    steps:
      - uses: actions/checkout@v7

      - id: setup
        uses: ./.github/actions/setup
        with:
          project: ${{ matrix.project }}

      - if: env.SERVICES == 'true'
        working-directory: .
        run: dev/services.sh

      - run: mix precommit --check --only "$ONLY"
        env:
          ONLY: ${{ matrix.only }}
          WARDRIK_TEST_SERVICES: ${{ env.SERVICES == 'true' && 'required' || '' }}

      # Saved from a failed leg too, since the compile it paid for is still
      # good; not from a cancelled one, which may have left _build half-written.
      - if: ${{ !cancelled() && steps.setup.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ matrix.project }}/deps
            ${{ matrix.project }}/_build
            ${{ matrix.project }}/priv/plts
          key: ${{ steps.setup.outputs.key }}

  # New applications that depend on Wardrik, neither with :ekv: a Phoenix app
  # that keeps it in its own Repo, and a bare Mix app that keeps it in a
  # bucket, without :ecto_sql either. See dev/hosts.sh.
  hosts:
    name: hosts
    needs: projects
    if: needs.projects.outputs.hosts == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          project: packages/wardrik

      - run: dev/services.sh
      - run: dev/hosts.sh

  # The TypeScript SDK: its types are the ones the protocol's schemas make,
  # its tests pass, and it builds.
  sdk-typescript:
    name: sdk (typescript)
    needs: projects
    if: needs.projects.outputs.sdk == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm run build

  # The docs site builds. Its reference pages are what mix wardrik.docs writes,
  # which the daemon's leg checks.
  docs:
    name: docs
    needs: projects
    if: needs.projects.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - run: npm ci
      - run: npm run build

  # The daemon's image and its release tarball, from one build in the
  # Dockerfile, on Ubuntu 22.04 so the tarball runs on any Linux with glibc 2.35
  # and OpenSSL 3, for each architecture the projects job names, each on a
  # runner of its own. The tarball is booted, installed on fresh
  # distributions, run as a service and failed over; the image is booted and
  # asked over HTTP. A push keeps each image as :sha-<commit>-<platform>, and
  # the image job joins them.
  release:
    name: release (linux-${{ matrix.arch }})
    needs: projects
    if: needs.projects.outputs.release == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.projects.outputs.arches) }}
    outputs:
      version: ${{ steps.tarball.outputs.version }}
      name: ${{ steps.tarball.outputs.name }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wardrik" >> "$GITHUB_OUTPUT"

      # The image first, so its cache holds the build stage the tarball is
      # taken from too.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: image
          load: true
          tags: wardrik:ci
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,scope=release-${{ matrix.arch }},mode=max

      - name: Build the tarball
        uses: docker/build-push-action@v7
        with:
          context: .
          target: tarball
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=release-${{ matrix.arch }}

      - name: Name the tarball
        id: tarball
        run: |
          version=$(sed -n 's/^ *@version "\(.*\)"$/\1/p' packages/wardrik_daemon/mix.exs)
          name="wardrik-$version-linux-${{ matrix.arch }}.tar.gz"
          mv "dist/wardrikd-$version.tar.gz" "$name"
          mkdir unpacked && tar -xzf "$name" -C unpacked

          {
            echo "version=$version"
            echo "name=$name"
            echo "sbom=wardrik-$version-linux-${{ matrix.arch }}.spdx.json"
            echo "image_sbom=wardrik-$version-image-${{ matrix.platform }}.spdx.json"
          } >> "$GITHUB_OUTPUT"

      # What ships, as SPDX: the OTP applications in the release, and the
      # image's packages beside them.
      - uses: anchore/sbom-action@v0
        with:
          path: unpacked
          format: spdx-json
          output-file: ${{ steps.tarball.outputs.sbom }}
          upload-artifact: false
          upload-release-assets: false

      - uses: anchore/sbom-action@v0
        with:
          image: wardrik:ci
          format: spdx-json
          output-file: ${{ steps.tarball.outputs.image_sbom }}
          upload-artifact: false
          upload-release-assets: false

      # Where each was built, signed by this workflow. Artifact attestations
      # need a public repository on this plan.
      - if: github.event_name == 'push' && !github.event.repository.private
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.tarball.outputs.name }}

      # Unpacked somewhere new and started with no keys and no home of its own,
      # the way a first install is: one agent file that reads, one that does
      # not, a data directory someone else made open to everyone, and a first
      # try at distribution on every interface.
      - name: Boot it
        run: |
          root=$(mktemp -d)
          tar -xzf "${{ steps.tarball.outputs.name }}" -C "$root"
          HOME=$(mktemp -d)
          export HOME
          # The runner's image points these at its own home.
          unset XDG_CONFIG_HOME XDG_DATA_HOME XDG_STATE_HOME

          mkdir -p "$HOME/.config/wardrik/agents"
          printf 'You help.\n' > "$HOME/.config/wardrik/agents/good.md"
          printf -- '---\norg: acme/eu\n---\nYou help.\n' > "$HOME/.config/wardrik/agents/bad.md"
          mkdir -p -m 755 "$HOME/.local/share/wardrik"

          # Distribution beyond loopback is refused until someone says so.
          if WARDRIK_DIST_INTERFACE=any "$root/bin/wardrik" start 2> refused.txt; then
            echo "wardrik started with distribution on every interface" >&2
            exit 1
          fi
          grep -q "beyond loopback" refused.txt
          if pgrep -f "$root/erts-[^/]*/bin/beam"; then
            echo "a node was left running after wardrik refused to start" >&2
            exit 1
          fi

          "$root/bin/wardrik" start
          trap '"$root/bin/wardrik" stop || true' EXIT

          "$root/bin/wardrikd" rpc '
            {:ok, _pid} = Wardrik.Fleet.spawn(Wardrik.Fleet.key("smoke"))
            ["default/good", "default/smoke"] = Enum.sort(Enum.map(Wardrik.Fleet.list(), & &1.key))
          '

          "$root/bin/wardrik" status | tee status.txt
          grep -q "default/smoke" status.txt
          grep -q "default/good" status.txt
          grep -q "bad.md: an agent.s org is \"acme/eu\"" status.txt

          for private in "$HOME/.local/share/wardrik" "$HOME/.local/share/wardrik/store" "$HOME/.local/state/wardrik"; do
            test "$(stat -c %a "$private")" = 700 || { echo "$private is not private" >&2; exit 1; }
          done
          test "$(stat -c %a "$HOME/.local/share/wardrik/cookie")" = 600
          test "$(stat -c %a "$HOME/.local/state/wardrik/log/wardrik.log")" = 600

          if ss -Hltnp | awk '/beam|epmd/ && $4 !~ /^(127\.0\.0\.1|\[::1\]):/ { print; found = 1 } END { exit !found }'; then
            echo "distribution is listening beyond loopback" >&2
            exit 1
          fi

          # A stop returns once the node is gone, so a start straight after
          # begins a node of its own.
          "$root/bin/wardrik" stop
          if pgrep -f "$root/erts-[^/]*/bin/beam"; then
            echo "the node was still running after wardrik stop returned" >&2
            exit 1
          fi

          "$root/bin/wardrik" start
          "$root/bin/wardrik" status | tee status.txt
          grep -q "default/good" status.txt

      # deploy/install.sh on Ubuntu 22.04 and 24.04 and Debian 12 and 13, where
      # it installs and the daemon runs, and on Debian 11 and Alpine, where it
      # refuses and says why. See dev/distros.sh.
      - name: Install it
        run: dev/distros.sh "${{ steps.tarball.outputs.name }}"

      # wardrik service install in a container running systemd: the daemon runs
      # as a user's unit, answers, is running again after the container
      # restarts, and is gone once uninstalled. See dev/service.sh.
      - name: Run it as a service
        run: dev/service.sh "${{ steps.tarball.outputs.name }}"

      # Started on named volumes, as the README runs it: the API answers on the
      # port it is run with, refuses a request without a token, and still knows
      # a token after a restart, which the volume kept. wardrik init writes a
      # first agent into the config volume and seals its key, with no terminal.
      - name: Boot the image
        run: |
          docker run -d --name wardrik -p 127.0.0.1:4747:4747 \
            -v wardrik-config:/config -v wardrik:/data wardrik:ci
          trap 'docker logs wardrik 2>&1 | tail -n 40' ERR

          code() { curl -s -o /dev/null -w '%{http_code}' "$@" http://127.0.0.1:4747/v1/agents; }

          # The node answers before the API listens, and curl reads 000 until
          # it does.
          up() {
            for _ in $(seq 60); do
              docker exec wardrik wardrik status > /dev/null 2>&1 && [ "$(code)" != 000 ] && return 0
              sleep 1
            done
            return 1
          }

          up
          docker exec wardrik wardrik status
          test "$(code)" = 401

          docker exec -e CI_KEY=sk-ant-ci wardrik wardrik init --provider anthropic \
            --key-from-env CI_KEY --yes --no-ask --no-service
          docker exec wardrik wardrik ls | grep -q default/assistant
          docker exec wardrik wardrik vault ls | grep -q ANTHROPIC_API_KEY

          token=$(docker exec wardrik wardrik token create ci --all --unlimited | head -n 1)
          echo "::add-mask::$token"
          test "$(code -H "authorization: Bearer $token")" = 200

          docker restart wardrik > /dev/null
          up
          test "$(code -H "authorization: Bearer $token")" = 200
          test "$(docker inspect --format '{{.Config.User}}' wardrik)" = wardrik
          docker stop wardrik

      # The store in Postgres, then in a bucket, and a node lost to kill -9:
      # its agent carries on on the cluster's other node, or on a new machine
      # given the same config.yaml. See dev/failover.sh.
      - name: Fail over
        run: |
          dev/services.sh
          root=$(mktemp -d)
          tar -xzf "${{ steps.tarball.outputs.name }}" -C "$root"
          dev/failover.sh postgres "$root"
          dev/failover.sh s3 "$root"

      - name: Show the daemon's logs
        if: failure()
        run: |
          for log in /tmp/tmp.*/.local/state/wardrik/log/*.log /tmp/tmp.*/.local/state/wardrik/tmp/log/erlang.log.*; do
            [ -f "$log" ] && { echo "== $log"; tail -n 80 "$log"; }
          done
          true

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.tarball.outputs.name }}
          path: |
            ${{ steps.tarball.outputs.name }}
            ${{ steps.tarball.outputs.sbom }}
            ${{ steps.tarball.outputs.image_sbom }}
          if-no-files-found: error
          retention-days: 7

      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: github.event_name == 'push'
        name: Push the image
        id: push
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker tag wardrik:ci "$IMAGE:sha-$GITHUB_SHA-$PLATFORM"
          docker push "$IMAGE:sha-$GITHUB_SHA-$PLATFORM"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$GITHUB_SHA-$PLATFORM")
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"

      - if: github.event_name == 'push' && !github.event.repository.private
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # One result for branch protection to require, whichever jobs a change ran:
  # it fails where any of them failed or was cancelled, and passes where each
  # passed or was not needed.
  checks:
    name: checks
    if: always()
    needs: [projects, check, hosts, sdk-typescript, docs, release]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "a job needed here ended $result" >&2; exit 1 ;;
            esac
          done

  # The images the release job booted, one for each platform, joined into one
  # and named once every check has passed: :sha-<commit>, with :main for a
  # push to main, and the version for a v* tag, with :latest unless it is a
  # pre-release such as 0.1.0-rc.1.
  image:
    name: image
    if: github.event_name == 'push'
    needs: [check, release]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - env:
          IMAGE: ${{ needs.release.outputs.image }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          tags=(-t "$IMAGE:sha-$GITHUB_SHA")

          case "$GITHUB_REF" in
            refs/heads/main) tags+=(-t "$IMAGE:main") ;;
            refs/tags/v*)
              if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
                echo "tag $GITHUB_REF_NAME does not match packages/wardrik_daemon/mix.exs version $VERSION" >&2
                exit 1
              fi
              tags+=(-t "$IMAGE:$VERSION")
              case "$VERSION" in *-*) ;; *) tags+=(-t "$IMAGE:latest") ;; esac
              ;;
          esac

          docker buildx imagetools create "${tags[@]}" \
            "$IMAGE:sha-$GITHUB_SHA-amd64" "$IMAGE:sha-$GITHUB_SHA-arm64"

  # Every push adds three images to a package the org pays to store. Keeps
  # :main, :latest, each version and the newest few :sha-<commit>, with the
  # platform images each joins, and deletes the rest.
  prune:
    name: prune
    needs: image
    runs-on: ubuntu-24.04
    concurrency:
      group: prune-images
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          exclude-tags: main,latest,*.*.*
          keep-n-tagged: 5
          delete-untagged: true

  # A v* tag publishes the tarballs the release job booted, their SBOMs, a
  # SHA256SUMS of both and the install script, once every check has passed. A
  # pre-release version is published as a pre-release.
  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: deploy/install.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          pattern: wardrik-*-linux-*.tar.gz
          merge-multiple: true

      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match packages/wardrik_daemon/mix.exs version $VERSION" >&2
            exit 1
          fi
          case "$VERSION" in *-*) prerelease=--prerelease ;; *) prerelease= ;; esac
          sha256sum wardrik-*.tar.gz wardrik-*.spdx.json > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" wardrik-*.tar.gz wardrik-*.spdx.json SHA256SUMS deploy/install.sh \
            --repo "$GITHUB_REPOSITORY" --generate-notes $prerelease

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Compiles deps in two OS processes, matching the 2-vCPU runner a private
  # repo gets.
  MIX_OS_DEPS_COMPILE_PARTITION_COUNT: "2"

jobs:
  # One leg per `mix precommit` group, each with a cache of its own. The
  # groups are listed in mix.exs.
  check:
    name: ${{ matrix.group }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        group: [lint, test, dialyzer]
    steps:
      - uses: actions/checkout@v7

      - id: setup
        uses: ./.github/actions/setup
        with:
          cache-key: ${{ matrix.group }}

      - run: mix precommit --check --only ${{ matrix.group }}

      # Saved from a failed leg too, since the compile it paid for is still
      # good; not from a cancelled one, which may have left _build half-written.
      - if: ${{ !cancelled() && steps.setup.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ steps.setup.outputs.key }}

  release:
    name: release (linux-x86_64)
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: prod
    outputs:
      version: ${{ steps.tarball.outputs.version }}
      name: ${{ steps.tarball.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - id: setup
        uses: ./.github/actions/setup
        with:
          cache-key: release

      - name: Build
        run: mix release --overwrite

      - name: Name the tarball
        id: tarball
        run: |
          version=$(sed -n 's/^ *version: "\(.*\)",$/\1/p' mix.exs)
          name="tars-$version-linux-x86_64.tar.gz"
          mv "_build/prod/tarsd-$version.tar.gz" "$name"
          rm -rf _build/prod/rel
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - if: ${{ !cancelled() && steps.setup.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ steps.setup.outputs.key }}

      # Unpacked somewhere new and started with no keys and no home of its own,
      # the way a first install is.
      - name: Boot it
        run: |
          root=$(mktemp -d)
          tar -xzf "${{ steps.tarball.outputs.name }}" -C "$root"
          HOME=$(mktemp -d)
          export HOME

          "$root/bin/tars" start
          trap '"$root/bin/tars" stop || true' EXIT

          "$root/bin/tarsd" rpc '
            {:ok, _pid} = Tars.Fleet.spawn(Tars.Fleet.key("smoke"))
            ["_/_/smoke"] = Enum.map(Tars.Fleet.list(), & &1.key)
          '

          "$root/bin/tars" status | tee status.txt
          grep -q "_/_/smoke" status.txt

          test "$(stat -c %a "$HOME/.local/share/tars/cookie")" = 600
          test -s "$HOME/.local/state/tars/log/tars.log"

          if ss -Hltnp | grep beam | grep -v '127.0.0.1'; then
            echo "distribution is listening beyond loopback" >&2
            exit 1
          fi

      - name: Show the daemon's logs
        if: failure()
        run: |
          for log in /tmp/tmp.*/.local/state/tars/log/*.log /tmp/tmp.*/.local/state/tars/tmp/log/erlang.log.*; do
            [ -f "$log" ] && { echo "== $log"; tail -n 80 "$log"; }
          done
          true

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.tarball.outputs.name }}
          path: ${{ steps.tarball.outputs.name }}
          if-no-files-found: error

  # A v* tag publishes the tarball the release job booted, once every check
  # has passed.
  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.release.outputs.name }}

      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          TARBALL: ${{ needs.release.outputs.name }}
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match mix.exs version $VERSION" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "$TARBALL" --repo "$GITHUB_REPOSITORY" --generate-notes

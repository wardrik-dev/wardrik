name: Set up Elixir
description: >
  Installs the Erlang and Elixir named in mise.toml, restores the build cache
  of one Mix project, and fetches its deps. The job saves the cache itself,
  under the `key` output, with actions/cache/save.

inputs:
  project:
    description: The Mix project's directory, such as packages/wardrik, whose cache is the job's own.
    required: true

outputs:
  key:
    description: The key to save the cache under.
    value: ${{ steps.key.outputs.key }}
  cache-hit:
    description: Whether the cache was restored from an exact match.
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - id: versions
      shell: bash
      run: |
        echo "otp=$(sed -n 's/^erlang = "\(.*\)"/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
        echo "elixir=$(sed -n 's/^elixir = "\([^"-]*\).*"/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

    - uses: erlef/setup-beam@v1
      with:
        otp-version: ${{ steps.versions.outputs.otp }}
        elixir-version: ${{ steps.versions.outputs.elixir }}
        version-type: strict

    # The key ends in the project's lockfile, so a project saves one entry for
    # each set of dependencies, and every run after restores it and compiles
    # only what changed since. What takes minutes, compiling the dependencies
    # and building the PLTs, changes only with the lockfile; saving an entry
    # per commit would have eighteen projects evict each other's.
    - id: key
      shell: bash
      env:
        PREFIX: ${{ runner.os }}-${{ runner.arch }}-otp${{ steps.versions.outputs.otp }}-elixir${{ steps.versions.outputs.elixir }}-${{ inputs.project }}
        LOCK: ${{ hashFiles(format('{0}/mix.lock', inputs.project)) }}
      run: |
        echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
        echo "key=$PREFIX-$LOCK" >> "$GITHUB_OUTPUT"

    - id: restore
      uses: actions/cache/restore@v6
      with:
        path: |
          ${{ inputs.project }}/deps
          ${{ inputs.project }}/_build
          ${{ inputs.project }}/priv/plts
        key: ${{ steps.key.outputs.key }}
        restore-keys: |
          ${{ steps.key.outputs.prefix }}-

    - shell: bash
      working-directory: ${{ inputs.project }}
      run: mix deps.get
